name: Update NSE & BSE Anchor Allocation Reports

on:
  schedule:
    # --- Monday to Friday (1-5) Schedule in UTC (IST = UTC + 5:30) ---
    # 3:00 PM to 6:00 PM IST (09:30 to 12:30 UTC) - Every 15 minutes
    - cron: '30,45 9 * * 1-5'
    - cron: '*/15 10,11 * * 1-5'
    - cron: '0,15,30 12 * * 1-5'
    # 6:00 PM to 10:00 PM IST (12:35 to 16:30 UTC) - Every 5 minutes (Peak Window)
    - cron: '35,40,45,50,55 12 * * 1-5'
    - cron: '*/5 13,14,15 * * 1-5'
    - cron: '0,5,10,15,20,25,30 16 * * 1-5'
    # 10:00 PM to 11:00 PM IST (16:35 to 17:30 UTC) - Every 15 minutes
    - cron: '45 16 * * 1-5'
    - cron: '0,15,30 17 * * 1-5'
  workflow_dispatch: # Allows manual run anytime from GitHub UI

permissions:
  contents: write

jobs:
  sync-anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Sync NSE & BSE Anchor Data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          node update-anchor-data.js

      - name: Commit and push if anchor data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nse-ipo-data.json anchor-sync-log.json notified-anchors.json
          if git diff --staged --quiet; then
            echo "No changes detected in Anchor data or sync logs."
          else
            git commit -m "chore(anchor): auto-update NSE & BSE anchor reports and sync logs [skip ci]"
            git push
          fi
