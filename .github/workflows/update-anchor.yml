name: Update Exchange Anchor Allocation Reports

  workflow_dispatch: # Manual trigger only (Render server handles live anchor data)

permissions:
  contents: write

concurrency:
  group: market-data-writer
  cancel-in-progress: false

jobs:
  sync-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Custom Panel PIN Hash if secret set
        env:
          PANEL_PIN: ${{ secrets.PANEL_PIN }}
        run: |
          if [ -n "$PANEL_PIN" ]; then
            node set-pin.js "$PANEL_PIN"
          fi

      - name: Fetch and Sync Exchange Anchor Data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NSE_BASE_URL: ${{ secrets.NSE_BASE_URL }}
          BSE_BASE_URL: ${{ secrets.BSE_BASE_URL }}
        run: |
          node update-anchor-data.js --force

      - name: Commit and push if anchor data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nse-ipo-data.json anchor-sync-log.json notified-anchors.json security.js anchors/
          if git diff --staged --quiet; then
            echo "No changes detected in Anchor data or sync logs."
          else
            git commit -m "chore(anchor): auto-update exchange anchor reports and sync logs"
            git pull --rebase origin main
            git push
          fi
