name: Update Market GMP Data

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Custom Panel PIN Hash if secret set
        env:
          PANEL_PIN: ${{ secrets.PANEL_PIN }}
        run: |
          if [ -n "$PANEL_PIN" ]; then
            node set-pin.js "$PANEL_PIN"
          fi

      - name: Fetch and parse latest GMP data
        env:
          GMP_SOURCE_URL: ${{ secrets.GMP_SOURCE_URL }}
        run: |
          node fetch-gmp.js

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json security.js
          if git diff --staged --quiet; then
            echo "No changes detected in GMP data."
          else
            git commit -m "chore(data): auto-update GMP data"
            git push
          fi
