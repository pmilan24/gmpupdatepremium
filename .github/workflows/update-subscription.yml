name: Sync IPO Subscription Data to Backend & Web

on:
  schedule:
    # --- Monday to Friday Schedule in UTC (IST = UTC + 5:30) ---
    # 09:55 AM to 05:00 PM IST (04:25 to 11:30 UTC) - Every 5 minutes (Continuous Trading Session)
    - cron: '25,30,35,40,45,50,55 4 * * 1-5'
    - cron: '*/5 5,6,7,8,9,10 * * 1-5'
    - cron: '0,5,10,15,20,25,30 11 * * 1-5'
    # 05:00 PM to 06:00 PM IST (11:30 to 12:30 UTC) - Every 10 minutes (Closing Tally Window)
    - cron: '40,50 11 * * 1-5'
    - cron: '0,10,20,30 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

concurrency:
  group: subscription-live-session
  cancel-in-progress: false

jobs:
  sync-subscription:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Fetch Live Subscription & Sync to Backend API
        env:
          # Secure Credentials & Endpoints configured in GitHub Repository Secrets
          AUTH_LOGIN_URL: ${{ secrets.AUTH_LOGIN_URL }}
          AUTH_EMAIL: ${{ secrets.AUTH_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          BACKEND_IPO_LIST_URL: ${{ secrets.BACKEND_IPO_LIST_URL }}
          BACKEND_UPDATE_SUB_URL: ${{ secrets.BACKEND_UPDATE_SUB_URL }}
          BACKEND_API_TOKEN: ${{ secrets.BACKEND_API_TOKEN }}
          SUB_DASH_URL: ${{ secrets.SUB_DASH_URL }}
          SUB_WEB_URL: ${{ secrets.SUB_WEB_URL }}
          JINA_PREFIX_URL: ${{ secrets.JINA_PREFIX_URL }}
        run: |
          node subscription-session.js ${{ github.event_name == 'workflow_dispatch' && '--force-first' || '' }}
